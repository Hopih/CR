<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="css/base.css">
    <link rel="stylesheet" type="text/css" href="css/layout.css">
    <link rel="stylesheet" type="text/css" href="css/toolbar.css">
    <link rel="stylesheet" type="text/css" href="css/auth.css">
    <link rel="stylesheet" type="text/css" href="css/popup.css">
    <link rel="stylesheet" type="text/css" href="css/forms.css">
    <link rel="stylesheet" type="text/css" href="css/board.css">
    <link rel="stylesheet" type="text/css" href="css/animations.css">
</head>
<body>
    <header>
        <h2>Hello to my Board</h2>
        <div class="auth-buttons" id="auth-buttons">
        </div>
    </header>
    <main>
        <div id="boards-overlay" class="boards-overlay hidden">
            <div class="boards-container">
                <h3>Мои доски</h3>
                <div class="boards-grid" id="boards-grid"></div>
                <button id="close-boards" class="auth-button logout">Закрыть</button>
            </div>
        </div>
        <div class="board" id="board">
            <!-- Здесь будут добавляться заметки -->
        </div>
        <div class="toolbar">
            <button id="addSticker" class="toolbar-button">
                <img src="sticker.svg" alt="Стикер" />
            </button>
            <button id="addText" class="toolbar-button">
                <img src="text.svg" alt="Текст" />
            </button>
            <button id="saveButton" class="toolbar-button" title="Сохранить">
                <img src="save.svg" width="32" height="32" alt="Сохранить">
            </button>
        </div>
        
    </main>
    <footer><h2>About us</h2></footer>
    <script type="module" src="js/main.js"></script>
</body>
</html>
