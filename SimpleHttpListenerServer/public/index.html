<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href="css/styles.css"/>
</head>
<body>
    <header>
        <h2>Hello to my Board</h2>
        <div class="links">
            <a href="#" id="signup-link">Sign Up</a>
            <a href="#" id="signin-link">Sign In</a>
        </div>
    </header>
    <main>
        <div class="board" id="board">
            <!-- Здесь будут добавляться заметки -->
        </div>
        <div class="toolbar">
            <button id="addSticker" class="toolbar-button">
                <img src="sticker.svg" alt="Стикер" />
            </button>
            <button id="addText" class="toolbar-button">
                <img src="text.svg" alt="Текст" />
            </button>
            <button id="saveButton" class="toolbar-button" title="Сохранить">
                <img src="save.svg" width="32" height="32" alt="Сохранить">
            </button>
        </div>
        
    </main>
    <footer><h2>About us</h2></footer>
    <script type="module" src="js/main.js"></script>
</body>
</html>
