<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Учебная доска</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<header class="app-header">
    <div class="user-zone"><span id="userInfo" role="status">Гость</span></div>
    <nav class="auth-zone" aria-label="Аккаунт">
        <button id="registerButton" type="button" class="btn btn-success">Регистрация</button>
        <button id="loginButton" type="button" disabled
                title="Вход добавим на следующем этапе">Войти</button>
    </nav>
    <div class="board-controls">
        <h2 id="boardTitle">Учебная доска</h2>
        <select id="boardSelect" aria-label="Выбрать доску"></select>
        <button id="newBoard" type="button" class="btn btn-primary">Новая доска</button>
        <button id="openBoard" type="button" class="btn btn-primary">Открыть по UUID</button>
        <button id="deleteBoard" type="button" class="btn btn-danger">Удалить доску</button>
        <button id="reloadBoard" type="button" class="btn btn-light">Перечитать</button>
    </div>
</header>
<main>
    <div class="board" id="board" aria-label="Доска"></div>
</main>
<div class="toolbar">
    <button id="addSticker" class="toolbar-button"
            type="button" aria-label="Добавить стикер">
        <img src="sticker.svg" alt="">
    </button>
    <button id="addText" class="toolbar-button" type="button"
            disabled title="Отдельный тип текста добавим позже">
        <img src="text.svg" alt="Текст">
    </button>
</div>
<footer><span id="boardStatus" class="board-status" role="status"></span></footer>
<dialog id="boardPopup" class="board-popup" aria-labelledby="popupTitle"
        aria-describedby="popupDescription">
    <form novalidate>
        <h3 id="popupTitle"></h3>
        <p id="popupDescription" class="popup-description"></p>
        <div class="popup-field">
            <label for="popupInput" id="popupLabel"></label>
            <input id="popupInput" type="text" autocomplete="off"
                   aria-describedby="popupError">
        </div>
        <p id="popupError" class="popup-error" role="alert" hidden></p>
        <div class="popup-actions">
            <button type="button" class="popup-cancel">Отмена</button>
            <button type="submit" class="popup-submit"></button>
        </div>
    </form>
</dialog>
<dialog id="authPopup" class="board-popup auth-popup"
        aria-labelledby="authTitle" aria-describedby="authDescription">
    <form novalidate>
        <h3 id="authTitle"></h3>
        <p id="authDescription" class="popup-description"></p>
        <div class="popup-field">
            <label for="authLogin">Логин</label>
            <input id="authLogin" name="login" maxlength="40" autocomplete="username">
        </div>
        <div class="popup-field">
            <label for="authName">Имя</label>
            <input id="authName" name="displayName" maxlength="80" autocomplete="nickname">
        </div>
        <div class="popup-field">
            <label for="authPassword">Пароль</label>
            <input id="authPassword" name="password" type="password" maxlength="128">
        </div>
        <p class="popup-error" role="alert" hidden></p>
        <div class="popup-actions">
            <button type="button" class="popup-cancel">Отмена</button>
            <button type="submit" class="popup-submit">Продолжить</button>
        </div>
    </form>
</dialog>
<script type="module" src="/js/main.js"></script>
</body>
</html>
