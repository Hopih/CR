<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Курсы валют</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">Финансовый справочник</p><h1>Курсы валют</h1></div>
      <button id="refresh" type="button">Обновить</button>
    </header>
    <p>Официальные курсы к российскому рублю. Значение указано за номинал валюты.</p>
    <p id="status" role="status" aria-live="polite">Загрузка…</p>
    <div class="table-wrap">
      <table>
        <caption id="rates-date">Курсы валют</caption>
        <thead><tr><th scope="col">Код</th><th scope="col">Валюта</th><th scope="col">Номинал</th><th scope="col">Курс, ₽</th></tr></thead>
        <tbody id="rates"></tbody>
      </table>
    </div>
    <footer>Источник: Банк России через <a href="https://www.cbr-xml-daily.ru/">Курсы валют, API</a>.
      Сервер кеширует данные на 5 минут. Курс банка при обмене может отличаться.</footer>
  </main>
</body>
</html>
