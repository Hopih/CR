<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Курсы валют</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">Финансовый справочник</p><h1>Курсы валют</h1></div>
      <button id="refresh" type="button">Обновить</button>
    </header>
    <p>Официальные курсы к российскому рублю. Значение указано за номинал валюты.</p>
    <form id="convert-form" class="convert-form">
      <input id="amount" value="100" aria-label="Сумма">   <!-- сумма -->
      <select id="from" aria-label="Из валюты"></select>   <!-- из валюты: пустой, заполнит JS -->
      <span>→</span>
      <select id="to" aria-label="В валюту"></select>      <!-- в валюту: пустой, заполнит JS -->
      <button type="submit">Конвертировать</button>
    </form>
    <p id="convert-result" class="convert-result" aria-live="polite"></p>   <!-- сюда JS напишет результат или ошибку -->
    <p id="status" role="status" aria-live="polite">Загрузка…</p>
    <div class="table-wrap">
      <table>
        <caption id="rates-date">Курсы валют</caption>
        <!-- Кнопки внутри заголовков: сами получают фокус по Tab и нажимаются Enter. data-sort — что передать серверу в ?sort= -->
        <thead><tr><th scope="col"><button type="button" class="sort" data-sort="code">Код<span class="arrow"></span></button></th><th scope="col"><button type="button" class="sort" data-sort="name">Валюта<span class="arrow"></span></button></th><th scope="col">Номинал</th><th scope="col"><button type="button" class="sort" data-sort="rate">Курс, ₽<span class="arrow"></span></button></th></tr></thead>
        <tbody id="rates"></tbody>
      </table>
    </div>
    <footer>Источник: Банк России через <a href="https://www.cbr-xml-daily.ru/">Курсы валют, API</a>.
      Сервер кеширует данные на 5 минут. Курс банка при обмене может отличаться.</footer>
  </main>
</body>
</html>
